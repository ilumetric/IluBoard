<!doctype html>
<html lang="ru" data-style="fun">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#18181b">
  <title>IluBoard</title>
  <meta name="description" content="IluBoard — канбан-доска, у которой источник правды — один board.json в git-репозитории. Kanban board whose source of truth is one board.json in a git repo.">
  <link rel="help" type="text/plain" href="llms.txt" title="Instructions for AI agents">
  <link rel="alternate" type="text/markdown" href="docs/AGENT.md" title="IluBoard for AI agents">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffd23f'/%3E%3Crect x='7' y='8' width='5' height='16' fill='%231c1917'/%3E%3Crect x='13.5' y='8' width='5' height='10' fill='%231c1917'/%3E%3Crect x='20' y='8' width='5' height='13' fill='%231c1917'/%3E%3C/svg%3E">
  <script>
    // style and language before first paint
    (function () {
      var l = null, s = null;
      try { l = localStorage.getItem('iluboard.lang'); s = localStorage.getItem('iluboard.style'); } catch (e) { /* storage disabled */ }
      if (l !== 'ru' && l !== 'en') l = /^ru\b/i.test(navigator.language || '') ? 'ru' : 'en';
      document.documentElement.lang = l;
      document.documentElement.setAttribute('data-style', s === 'calm' || s === 'oli' ? s : 'fun');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Marck+Script&display=swap">
  <link rel="stylesheet" href="src/app/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <div id="scrim" hidden></div>
    <main id="main">
      <header id="topbar"></header>
      <div id="banner" hidden></div>
      <section id="content"></section>
      <div id="composer-wrap" hidden></div>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>IluBoard needs JavaScript (ES modules). / Для IluBoard нужен JavaScript.</noscript>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
