name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node --test "test/*.test.js"
      - name: Bundle is up to date
        run: node tools/bundle.mjs --check
      - name: Example board is valid and canonical
        run: |
          node iluboard.mjs validate examples/board.json
          node iluboard.mjs fmt examples/board.json --check
